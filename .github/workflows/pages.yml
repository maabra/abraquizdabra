name: Validate and deploy AbraQuizDabra
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Locate browser
        run: echo "QUIZ_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install reference runtime libraries
        run: python -m pip install -r requirements-verification.txt
      - name: Generate bank
        run: npm run build
      - name: Install local-only framework audit dependencies
        run: npm ci --prefix audit/runtime --no-audit --no-fund --ignore-scripts
      - name: Independently calculate and execute stored questions
        run: npm run audit:native
        env:
          QUIZ_REQUIRE_RUNTIMES: '1'
      - name: Validate questions and execute supported references
        run: npm test
      - name: Package static files
        run: npm run package
      - name: Verify packaged site in browser at repository subpath
        run: npm run test:browser
        env:
          QUIZ_SITE_DIR: dist
      - name: Save verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .qa/*.png
            .qa/browser-report.json
            .qa/browser-stderr.log
            data/verification.json
            data/native-execution.json
            data/audit-summary.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

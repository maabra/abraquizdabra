name: Validate and deploy AbraQuizDabra
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reference runtime libraries
        run: python -m pip install -r requirements-verification.txt
      - name: Generate bank
        run: npm run build
      - name: Install local-only framework audit dependencies
        run: npm install --prefix .qa/runtime --no-audit --no-fund --ignore-scripts react@18.3.1 react-dom@18.3.1 @babel/standalone@7 vue@3 @vue/compiler-sfc@3
      - name: Independently calculate and execute stored questions
        run: npm run audit:native
      - name: Validate questions and execute supported references
        run: npm test
      - name: Package static files
        run: npm run package
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
